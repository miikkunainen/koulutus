<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MHKS · Metropolia · Muotoilun pajat</title>
<style>
/* ════ DESIGN TOKENS ══════════════════════════════════════
   Pajakuutio DNA: värit, emboss-shadow, centered layout   */
:root{
  --c1:#A9D4C4;--i1:#2C6450;--d1:#1f4d3b;
  --c2:#E6C6D2;--i2:#823A55;--d2:#5e2a3e;
  --c3:#B9D2E0;--i3:#2E5A72;--d3:#214255;
  --c4:#D8C7E0;--i4:#5B3F70;--d4:#432e54;
  --c5:#F4C8B8;--i5:#8A3D22;--d5:#662c19;
  --c6:#F3D9A6;--i6:#8A6A1E;--d6:#665015;
  --fill:var(--c1);--ink:var(--i1);--dark:var(--d1);
  --paper:#FBFAF7;--cloud:#F2EFE8;--mist:#E8E3DC;
  --bor:#DDD8CE;--text:#26251F;--sub:#5A5850;--hint:#8A8880;
  --sh-card: 0 28px 60px -38px color-mix(in srgb,var(--ink) 72%,transparent),
             0 2px 0 rgba(255,255,255,.88) inset;
  --sh-float:0 12px 28px -16px color-mix(in srgb,var(--ink) 50%,transparent),
             0 1px 0 rgba(255,255,255,.9) inset;
  --f:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --mono:"Consolas","Monaco",monospace;
  --rsm:9px;--rmd:15px;--rlg:22px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{font-family:var(--f);background:radial-gradient(1100px 440px at 50% -60px,color-mix(in srgb,var(--fill) 28%,var(--paper)),transparent 68%),var(--cloud);color:var(--text);line-height:1.55;min-height:100vh;transition:background 1.1s ease}
a{color:inherit;text-decoration:none}
button{cursor:pointer;border:none;background:none;font-family:var(--f)}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:4px}
img{display:block}

/* ═══ APP SHELL ════════════════════════════════════════════ */
#app{max-width:1200px;margin:0 auto;min-height:100vh;background:var(--paper);
  box-shadow:0 0 0 1px rgba(0,0,0,.04),0 2px 60px rgba(0,0,0,.08)}

/* ═══ INTRO ════════════════════════════════════════════════ */
#intro{position:fixed;inset:0;z-index:900;background:var(--paper);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:2rem 1.5rem}
.intro-skip{position:absolute;top:18px;right:20px;font-size:12px;
  color:var(--hint);background:none;border:1px solid var(--bor);
  border-radius:100px;padding:5px 14px;cursor:pointer;transition:.15s}
.intro-skip:hover{color:var(--text);border-color:var(--text)}
.intro-prog{display:flex;gap:7px;margin-bottom:36px}
.ip{width:28px;height:4px;border-radius:2px;background:var(--bor);transition:.3s}
.ip.on{background:var(--ink)}
.intro-card{max-width:520px;width:100%;text-align:center;
  background:#fff;border:1px solid var(--bor);border-radius:24px;
  padding:36px 32px 32px;
  box-shadow:0 40px 80px -36px rgba(0,0,0,.18),0 2px 0 rgba(255,255,255,.9) inset;
  animation:slideup .4s cubic-bezier(.34,1.4,.4,1)}
@keyframes slideup{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.ic-big{font-size:52px;margin-bottom:16px;line-height:1}
.ic-num{font-size:10px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;
  color:var(--hint);margin-bottom:6px}
.ic-title{font-size:26px;font-weight:700;color:var(--ink);margin-bottom:8px;letter-spacing:-.3px}
.ic-sub{font-size:14px;color:var(--sub);line-height:1.6;margin-bottom:22px}
.ic-tags{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-bottom:24px}
.ic-tag{font-size:11px;padding:4px 11px;border-radius:100px;
  border:1px solid color-mix(in srgb,var(--ink) 22%,transparent);
  color:var(--ink);background:color-mix(in srgb,var(--fill) 18%,#fff)}
.intro-nav{display:flex;gap:10px;justify-content:center;width:100%}
.ibt{padding:11px 28px;border-radius:100px;font-size:13px;font-weight:700;
  cursor:pointer;border:1.5px solid var(--bor);background:var(--cloud);
  color:var(--text);transition:.2s}
.ibt:hover{background:var(--mist);border-color:var(--text)}
.ibt.prim{background:var(--ink);border-color:var(--ink);color:color-mix(in srgb,var(--fill) 65%,#fff)}
.ibt.prim:hover{background:var(--dark)}

/* ═══ TOPBAR ═══════════════════════════════════════════════ */
.topbar{position:sticky;top:0;z-index:50;
  background:rgba(251,250,247,.93);backdrop-filter:blur(18px);
  border-bottom:1px solid var(--bor);
  box-shadow:0 1px 0 rgba(255,255,255,.7) inset,0 3px 10px rgba(0,0,0,.04)}
.tbi{max-width:860px;margin:0 auto;padding:0 16px;height:52px;
  display:flex;align-items:center;gap:10px}
.tbar-logo{width:28px;height:28px;border-radius:7px;flex-shrink:0;
  background:color-mix(in srgb,var(--fill) 38%,var(--paper));
  border:1.5px solid color-mix(in srgb,var(--ink) 22%,transparent);
  display:flex;align-items:center;justify-content:center;box-shadow:var(--sh-float);transition:1.1s}
.tbar-logo img{height:16px}
.tbar-names{flex:1;min-width:0}
.tbar-n{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbar-s{font-size:10px;color:var(--hint)}
.tbar-r{display:flex;align-items:center;gap:7px;flex-shrink:0}

/* Kognitiivinen kuorma — topbar */
.cog-wrap{display:flex;align-items:center;gap:6px;cursor:pointer;padding:4px 8px;
  border-radius:8px;border:1px solid var(--bor);background:var(--cloud);
  transition:.15s}
.cog-wrap:hover{background:var(--mist)}
.cog-ic{font-size:14px}
.cog-bar{width:44px;height:5px;background:var(--bor);border-radius:3px;overflow:hidden;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.07)}
.cog-fill{height:100%;border-radius:3px;transition:width .5s ease,background .5s}
.cog-pct{font-size:9px;font-weight:700;color:var(--sub);min-width:22px}

/* Tasoindikaattori */
.lv-ind{display:flex;align-items:center;gap:5px;padding:4px 10px 4px 7px;
  border-radius:100px;border:1px solid color-mix(in srgb,var(--ink) 15%,transparent);
  background:color-mix(in srgb,var(--fill) 16%,var(--paper));
  font-size:11px;font-weight:700;color:var(--ink);transition:1.1s;cursor:pointer}
.lv-dots{display:flex;gap:3px}
.lvd{width:6px;height:6px;border-radius:50%;border:1px solid color-mix(in srgb,var(--ink) 22%,transparent)}
.lvd.on{background:var(--ink);border-color:var(--ink)}
.logout-btn{font-size:11px;color:var(--hint);padding:4px 8px;border-radius:6px;
  transition:.15s;border:1px solid transparent}
.logout-btn:hover{background:var(--mist);color:var(--text);border-color:var(--bor)}

/* ═══ TAHKO NAV ════════════════════════════════════════════ */
.tahko-nav{border-bottom:1px solid var(--bor);background:rgba(251,250,247,.7);
  backdrop-filter:blur(8px);overflow:hidden}
.tn-s{max-width:860px;margin:0 auto;padding:8px 16px;
  display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tn-s::-webkit-scrollbar{display:none}
.tn-t{display:flex;align-items:center;gap:5px;padding:7px 13px;border-radius:100px;
  border:1.5px solid transparent;font-size:11.5px;font-weight:600;white-space:nowrap;
  flex-shrink:0;color:var(--hint);background:color-mix(in srgb,var(--mist) 45%,transparent);
  transition:all .22s cubic-bezier(.34,1.4,.4,1)}
.tn-t:hover{color:var(--text);background:color-mix(in srgb,var(--mist) 80%,transparent)}
.tn-t.active{background:color-mix(in srgb,var(--CC) 22%,var(--paper));
  border-color:color-mix(in srgb,var(--CI) 26%,transparent);color:var(--CI);
  box-shadow:0 5px 18px -5px color-mix(in srgb,var(--CI) 30%,transparent),
    0 1px 0 rgba(255,255,255,.8) inset}
.tn-t[data-t="1"]{--CC:var(--c1);--CI:var(--i1)}.tn-t[data-t="2"]{--CC:var(--c2);--CI:var(--i2)}
.tn-t[data-t="3"]{--CC:var(--c3);--CI:var(--i3)}.tn-t[data-t="4"]{--CC:var(--c4);--CI:var(--i4)}
.tn-t[data-t="5"]{--CC:var(--c5);--CI:var(--i5)}.tn-t[data-t="6"]{--CC:var(--c6);--CI:var(--i6)}
.tn-dot{width:5px;height:5px;border-radius:50%;background:var(--CI);opacity:.5;transition:.2s}
.tn-t.active .tn-dot{opacity:1}

/* ═══ CONTENT ══════════════════════════════════════════════ */
.content{max-width:860px;margin:0 auto;padding:18px 16px 100px}

/* ═══ KORTIT ═══════════════════════════════════════════════ */
.card{background:color-mix(in srgb,var(--fill) 10%,#fff);
  border:1px solid color-mix(in srgb,var(--ink) 12%,transparent);
  border-radius:var(--rlg);padding:16px 18px;margin-bottom:11px;
  box-shadow:var(--sh-card);transition:background 1.1s,border-color 1.1s}
.card.plain{background:#fff;border-color:var(--bor);box-shadow:var(--sh-float)}
.card.ok{background:color-mix(in srgb,var(--c1) 18%,#fff);border-color:color-mix(in srgb,var(--i1) 18%,transparent)}
.card.warn{background:color-mix(in srgb,var(--c2) 18%,#fff);border-color:color-mix(in srgb,var(--i2) 18%,transparent)}
.card.info{background:color-mix(in srgb,var(--c3) 18%,#fff);border-color:color-mix(in srgb,var(--i3) 18%,transparent)}
.card.chem{background:color-mix(in srgb,var(--c6) 18%,#fff);border-color:color-mix(in srgb,var(--i6) 18%,transparent)}
.card h3{font-size:13.5px;font-weight:700;margin:0 0 11px;color:var(--text)}

/* ═══ STAT TILES ════════════════════════════════════════════ */
.sg{display:grid;gap:8px;margin-bottom:11px}
.sg2{grid-template-columns:1fr 1fr}.sg3{grid-template-columns:repeat(3,1fr)}.sg4{grid-template-columns:repeat(4,1fr)}
.stile{background:color-mix(in srgb,var(--fill) 20%,#fff);border:1px solid color-mix(in srgb,var(--ink) 9%,transparent);
  border-radius:12px;padding:12px 14px;
  box-shadow:0 10px 26px -14px color-mix(in srgb,var(--ink) 45%,transparent),
    0 1px 0 rgba(255,255,255,.9) inset;transition:background 1.1s}
.stl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--hint);margin-bottom:3px}
.stv{font-size:21px;font-weight:700;line-height:1}
.sts{font-size:10px;color:var(--sub);margin-top:2px}

/* ═══ BAR ══════════════════════════════════════════════════ */
.barw{height:5px;background:var(--mist);border-radius:3px;overflow:hidden;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.07);flex:1}
.barf{height:100%;border-radius:3px;transition:width .5s ease}

/* ═══ BADGES ════════════════════════════════════════════════ */
.bdg{display:inline-block;font-size:9.5px;font-weight:700;padding:2px 9px;
  border-radius:100px;border:1px solid transparent;white-space:nowrap}
.ok{background:#EDF7ED;color:#265C26;border-color:#A9D4C4}
.wn{background:#FDF6E3;color:#8A6A1E;border-color:#E8C97A}
.dn{background:#FEF0F0;color:#823A55;border-color:#E6C6D2}
.in{background:#EBF3FB;color:#2E5A72;border-color:#B9D2E0}
.gh{background:var(--mist);color:var(--sub);border-color:var(--bor)}
.pp{background:#F3F0FB;color:#5B3F70;border-color:#D8C7E0}
.risk{display:inline-block;font-size:9.5px;font-weight:700;padding:2px 9px;border-radius:100px;border:1px solid transparent}
.r1{background:#EDF7ED;color:#2C6450;border-color:#A9D4C4}.r2{background:#F0F7F0;color:#2C6450;border-color:#A9D4C4}
.r3{background:#FDF6E3;color:#8A6A1E;border-color:#F3D9A6}.r4{background:#FDF0EC;color:#8A3D22;border-color:#F4C8B8}
.r5{background:#FDF0F4;color:#823A55;border-color:#E6C6D2}

/* ═══ ROW ═══════════════════════════════════════════════════ */
.row{display:flex;align-items:center;gap:10px;padding:9px 0;
  border-bottom:1px solid color-mix(in srgb,var(--ink) 7%,transparent)}
.row:last-child{border-bottom:none}
.rm{flex:1;min-width:0}
.rn{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rs{font-size:10.5px;color:var(--hint);margin-top:2px}

/* ═══ NOTE ══════════════════════════════════════════════════ */
.nt{border-left:3px solid var(--ink);padding:9px 13px;margin:8px 0;
  border-radius:0 9px 9px 0;background:color-mix(in srgb,var(--fill) 18%,#fff);
  font-size:12.5px;line-height:1.55;transition:background 1.1s}
.nt.warn{border-left-color:var(--i2);background:color-mix(in srgb,var(--c2) 15%,#fff)}
.nt.ok{border-left-color:var(--i1);background:color-mix(in srgb,var(--c1) 15%,#fff)}
.nt.info{border-left-color:var(--i3);background:color-mix(in srgb,var(--c3) 15%,#fff)}
.nt.danger{border-left-color:#C00;background:#FEF2F2}

/* ═══ BUTTONS ═══════════════════════════════════════════════ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;
  font-size:12px;font-weight:700;padding:9px 18px;border-radius:100px;cursor:pointer;
  border:1.5px solid color-mix(in srgb,var(--ink) 19%,transparent);
  background:color-mix(in srgb,var(--fill) 16%,#fff);color:var(--text);
  box-shadow:0 1px 0 rgba(255,255,255,.7) inset,0 3px 7px rgba(0,0,0,.06);
  transition:all .18s cubic-bezier(.34,1.4,.4,1);min-height:39px;line-height:1;font-family:var(--f)}
.btn:hover{transform:translateY(-2px);box-shadow:0 1px 0 rgba(255,255,255,.7) inset,0 7px 15px rgba(0,0,0,.1)}
.btn:active{transform:translateY(1px);box-shadow:none}
.btn.prim{background:linear-gradient(180deg,color-mix(in srgb,var(--ink) 82%,var(--fill)) 0%,var(--ink) 60%,var(--dark) 100%);
  border-color:var(--dark);color:color-mix(in srgb,var(--fill) 72%,#fff);
  box-shadow:0 1px 0 rgba(255,255,255,.14) inset,0 -2px 0 rgba(0,0,0,.2) inset,
    0 5px 13px -3px color-mix(in srgb,var(--ink) 50%,transparent)}
.btn.prim:hover{background:linear-gradient(180deg,var(--ink) 0%,var(--dark) 100%)}
.btn.sm{font-size:10.5px;padding:6px 13px;min-height:31px}
.btn.xs{font-size:10px;padding:4px 10px;min-height:26px}
.btn.full{display:flex;width:100%;border-radius:var(--rsm);margin-top:9px}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
.brow{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap}
.brow .btn{flex:1;min-width:76px}

/* ═══ FORM ══════════════════════════════════════════════════ */
.field{margin-bottom:12px}
.field label{display:block;font-size:10px;font-weight:700;text-transform:uppercase;
  letter-spacing:.07em;color:var(--sub);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;font-size:13px;padding:10px 12px;
  border:1.5px solid color-mix(in srgb,var(--ink) 14%,transparent);border-radius:9px;
  background:color-mix(in srgb,var(--fill) 5%,var(--paper));color:var(--text);
  outline:none;font-family:var(--f);
  box-shadow:inset 0 2px 4px rgba(0,0,0,.05);transition:.2s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--ink);
  background:color-mix(in srgb,var(--fill) 9%,#fff);
  box-shadow:inset 0 2px 4px rgba(0,0,0,.04),0 0 0 3px color-mix(in srgb,var(--fill) 28%,transparent)}
.field textarea{resize:vertical;min-height:76px}

/* ═══ WORKFLOW CARDS ════════════════════════════════════════ */
.wo-card{background:#fff;border:1px solid var(--bor);border-radius:var(--rmd);
  margin-bottom:10px;overflow:hidden;box-shadow:var(--sh-float)}
.wo-head{display:flex;align-items:center;gap:10px;padding:12px 15px;
  border-bottom:1px solid var(--bor)}
.wo-status-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.wo-info{flex:1;min-width:0}
.wo-title{font-size:13px;font-weight:700}
.wo-meta{font-size:10.5px;color:var(--hint)}
.wo-body{padding:10px 15px}
.wo-step{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:12px}
.wo-step-ic{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:9px;font-weight:700;flex-shrink:0;border:1px solid transparent}
.ws-done{background:#EDF7ED;color:#265C26;border-color:#A9D4C4}
.ws-wait{background:#EBF3FB;color:#2E5A72;border-color:#B9D2E0}
.ws-pend{background:var(--mist);color:var(--hint)}

/* ═══ PROSESSIOHJEET ════════════════════════════════════════ */
.ps-step{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--bor)}
.ps-step:last-child{border-bottom:none}
.ps-num{width:26px;height:26px;border-radius:50%;background:color-mix(in srgb,var(--fill) 30%,#fff);
  border:1.5px solid color-mix(in srgb,var(--ink) 20%,transparent);
  display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:800;color:var(--ink);flex-shrink:0;box-shadow:var(--sh-float)}
.ps-content{flex:1}
.ps-title{font-size:13px;font-weight:700;margin-bottom:4px}
.ps-desc{font-size:12.5px;color:var(--sub);line-height:1.55}
.ps-safety{margin-top:6px;background:color-mix(in srgb,var(--c2) 15%,#fff);
  border:1px solid color-mix(in srgb,var(--i2) 20%,transparent);
  border-radius:8px;padding:7px 10px;font-size:11.5px;color:var(--i2)}
.ps-ppe{margin-top:5px;display:flex;gap:5px;flex-wrap:wrap}
.ppe-tag{font-size:10.5px;font-weight:700;padding:3px 10px;border-radius:100px;
  background:#EBF3FB;color:#2E5A72;border:1px solid #B9D2E0}
.ps-check{display:flex;align-items:center;gap:8px;margin-top:8px;cursor:pointer;
  font-size:12px;font-weight:600}
.ps-check input{width:16px;height:16px;accent-color:var(--ink);cursor:pointer}
.ps-step.checked .ps-num{background:color-mix(in srgb,var(--c1) 40%,#fff);
  border-color:var(--i1);color:var(--i1)}

/* ═══ KEMIKAALIKORTTI ═══════════════════════════════════════ */
.chem-card{border-left:4px solid var(--i6);background:color-mix(in srgb,var(--c6) 14%,#fff);
  border-radius:0 var(--rmd) var(--rmd) 0;padding:12px 15px;margin-bottom:10px;
  box-shadow:var(--sh-float);cursor:pointer;transition:.2s}
.chem-card:hover{box-shadow:0 10px 28px -12px rgba(0,0,0,.15)}
.chem-head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.chem-name{font-size:13px;font-weight:700}
.chem-cas{font-size:10px;font-family:var(--mono);color:var(--hint)}
.hz-tags{display:flex;gap:4px;flex-wrap:wrap}
.hz-tag{width:22px;height:22px;border-radius:4px;background:color-mix(in srgb,var(--c6) 40%,#fff);
  border:1px solid color-mix(in srgb,var(--i6) 30%,transparent);
  display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:var(--i6)}
.chem-em{font-size:11.5px;color:var(--i2);font-weight:600;margin-top:4px}

/* ═══ TILAKARTTA ════════════════════════════════════════════ */
.space-map{background:var(--cloud);border-radius:var(--rmd);padding:14px;
  border:1px solid var(--bor);margin-bottom:12px}
.sm-room{border:2px solid var(--bor);border-radius:10px;background:#fff;
  position:relative;padding:8px 10px;margin-bottom:8px;min-height:90px}
.sm-room-lbl{font-size:10px;font-weight:700;text-transform:uppercase;
  letter-spacing:.08em;color:var(--hint);margin-bottom:8px}
.sm-items{display:flex;flex-wrap:wrap;gap:5px}
.sm-item{display:flex;align-items:center;gap:5px;padding:4px 10px;
  border-radius:100px;background:color-mix(in srgb,var(--fill) 16%,#fff);
  border:1px solid color-mix(in srgb,var(--ink) 10%,transparent);
  font-size:11px;font-weight:600;cursor:pointer;transition:.15s}
.sm-item:hover{background:color-mix(in srgb,var(--fill) 30%,#fff);
  border-color:color-mix(in srgb,var(--ink) 22%,transparent)}
.sm-item.mach{background:#EBF3FB;border-color:#B9D2E0;color:#2E5A72}
.sm-item.chem-loc{background:#FDF6E3;border-color:#E8C97A;color:#8A6A1E}
.sm-item.tool{background:#F3F0FB;border-color:#D8C7E0;color:#5B3F70}

════════════════════════════════════════════ */
const LOG={
  e:[],n:0,
  add(type,msg,det=''){
    const ts=new Date(),t=ts.toLocaleTimeString('fi-FI',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    this.e.unshift({n:++this.n,t,type,msg,det});
    if(this.e.length>200)this.e.length=200;
    const el=document.getElementById('ap-cnt');if(el)el.textContent=Math.min(this.n,999);
    const p=document.getElementById('ap-dot');if(p){p.style.background='#C8940A';setTimeout(()=>p.style.background='#4A8A4A',650);}
    if(document.getElementById('t-ov').classList.contains('open'))this.render();
  },
  render(){
    const el=document.getElementById('tlog');if(!el)return;
    const C={ok:'#4A8A4A',info:'#2E5A72',warn:'#8A6A1E',err:'#823A55',gold:'#8A3D22',sys:'#5B3F70'};
    const T={ok:'OK ',info:'INF',warn:'WRN',err:'ERR',gold:'✦  ',sys:'SYS'};
    if(!this.e.length){el.innerHTML='<div style="color:#2A2820;padding:10px 0">Lokia ei vielä ole.</div>';return;}
    el.innerHTML=this.e.map(e=>`<div class="lr"><span class="lts">[${e.t}]</span><span class="ltag" style="color:${C[e.type]||'#555'}">${T[e.type]||'---'}</span><div class="ltx">${E(e.msg)}${e.det?'<br><span style="color:#3A3830">'+E(e.det)+'</span>':''}</div></div>`).join('');
  },
  clear(){this.e=[];this.n=0;const el=document.getElementById('ap-cnt');if(el)el.textContent='0';this.render();}
};

════════════════════════════════════════════ */
const E=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const f2=n=>(Math.round(n*100)/100).toFixed(2);
const pct=(v,m)=>Math.min(100,Math.round(v/m*100));
const ini=n=>n.trim().split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase();
const bdg=(c,t)=>`<span class="bdg ${c}">${E(t)}</span>`;
const sBdg=st=>{const m={ok:['ok','Kunnossa'],low:['wn','Vähissä'],critical:['dn','Kriittinen'],warning:['wn','Lähestyy'],overdue:['dn','Erääntynyt'],arrived:['ok','Saapunut'],pending:['wn','Odottaa'],active:['ok','Käynnissä'],waiting_leh:['in','Odottaa lehtoria'],waiting_paja:['wn','Odottaa pajamestaria'],done:['gh','Valmis']};const[c,t]=m[st]||['gh',st];return bdg(c,t);};
const rsk=r=>{const l=['','Matala','Hallittu','Kohtalainen','Korkea','Korkein'];return `<span class="risk r${r}">${l[r]} ${r}/5</span>`;};
const bar=(v,m,c)=>{const w=pct(v,m);const col=c||(w>90?'var(--i2)':w>70?'var(--i6)':'var(--i1)');return `<div class="barw"><div class="barf" style="width:${w}%;background:${col}"></div></div>`;};
const nt=(cls,h)=>`<div class="nt ${cls||''}">${h}</div>`;
const btn=(l,a,id,c='')=>`<button class="btn${c?' '+c:''}" data-action="${a}" data-id="${E(id||'')}">${l}</button>`;
const row=(l,m,r='')=>`<div class="row">${l||''}<div class="rm">${m}</div>${r}</div>`;
const av=(n,ac,bg,sz='md')=>`<div class="av av-${sz}" style="background:${bg};color:${ac}">${E(n)}</div>`;
const stl=(l,v,c,s)=>`<div class="stile"><div class="stl">${E(l)}</div><div class="stv"${c?` style="color:${c}"`:''}>${v}</div>${s?`<div class="sts">${E(s)}</div>`:''}</div>`;
const card=(h,cls='')=>`<div class="card${cls?' '+cls:''}">${h}</div>`;
function sg(it,n){return `<div style="display:grid;grid-template-columns:repeat(${n},1fr);gap:8px;margin-bottom:11px">${it.join('')}</div>`}
function emp(ic,t,s){return `<div style="text-align:center;padding:2rem 1rem;color:var(--hint)"><div style="font-size:36px;margin-bottom:10px;opacity:.4">${ic}</div><div style="font-size:13px;font-weight:700;margin-bottom:4px;color:var(--sub)">${E(t)}</div><div style="font-size:11.5px">${E(s)}</div></div>`}

   KOGNITIIVINEN KUORMA
════════════════════════════════════════════ */
function calcCog(){
  const r=D.role, m=ROLES[r]||{lv:1};
  const openWO=D.workOrders.filter(w=>w.status!=='done').length;
  const lowInv=D.inv.filter(i=>i.st==='low'||i.st==='critical').length;
  const badMach=D.mach.filter(m=>m.st==='overdue'||m.st==='warning').length;
  const baseLoad=m.lv===1?25:m.lv===2?20:15;
  const total=baseLoad+(openWO*14)+(lowInv*8)+(badMach*10);
  return Math.min(100,total);
}
function updateCog(){
  const v=calcCog();
  const col=v>85?'#C00':v>70?'#B85418':v>45?'#8A6A1E':'#2C6450';
  const el=document.getElementById('cog-fill');const pt=document.getElementById('cog-pct');
  if(el){el.style.width=v+'%';el.style.background=col;}
  if(pt)pt.textContent=v+'%';
}

let ISLIDE=0;
const INTRO_COLORS=['--c1','--c2','--c3','--c4','--c5','--c6'];
function renderIntro(){
  const s=INTRO_SLIDES[ISLIDE],n=INTRO_SLIDES.length;
  const r=document.documentElement;
  r.style.setProperty('--fill',`var(${INTRO_COLORS[ISLIDE]})`);
  r.style.setProperty('--ink',`var(--i${ISLIDE+1})`);
  document.getElementById('iprog').innerHTML=Array(n).fill('').map((_,i)=>`<div class="ip${i<=ISLIDE?' on':''}"></div>`).join('');
  document.getElementById('ic').innerHTML=`<div class="ic-big">${s.ic}</div><div class="ic-num">Tahko ${ISLIDE+1} / ${n}</div><div class="ic-title">${E(s.t)}</div><div class="ic-sub">${E(s.d)}</div><div class="ic-tags">${s.tags.map(t=>`<span class="ic-tag">${E(t)}</span>`).join('')}</div>`;
  document.getElementById('iprev').style.visibility=ISLIDE===0?'hidden':'visible';
  document.getElementById('inext').textContent=ISLIDE===n-1?'Aloita →':'Seuraava →';
}
function introNav(d){
  ISLIDE=Math.max(0,Math.min(INTRO_SLIDES.length-1,ISLIDE+d));
  if(d>0&&ISLIDE>=INTRO_SLIDES.length)return skipIntro();
  if(ISLIDE===INTRO_SLIDES.length-1&&d>0){ISLIDE++;return skipIntro();}
  renderIntro();
}
function skipIntro(){
  const intro=document.getElementById('intro');
  intro.style.opacity='0';intro.style.transition='opacity .4s';

function setTahko(i){
  D.tahko=i;const t=TAHKOT[i-1];
  const r=document.documentElement;
  r.style.setProperty('--fill',`var(${t.fill})`);
  r.style.setProperty('--ink',`var(${t.ink})`);
  r.style.setProperty('--dark',`var(${t.dark})`);
  document.querySelectorAll('.tn-t').forEach(el=>el.classList.toggle('active',+el.dataset.t===i));
  document.getElementById('tbar-s').textContent=t.sub;
  document.getElementById('content').innerHTML=VIEWS[i-1]();
  updateCog();
  LOG.add('info',`Tahko ${i} — ${t.n}`,t.sub);
}

function login(role){
  D.role=role;const m=ROLES[role];
  document.getElementById('s-login').style.display='none';
  document.getElementById('s-app').style.display='';
  document.getElementById('api-bar').style.display='';
  document.getElementById('tbar-n').textContent=m.n;
  const lv=m.lv;
  document.getElementById('lv-name').textContent=m.lbl;
  document.getElementById('lv-dots').innerHTML=Array(5).fill('').map((_,i)=>`<div class="lvd${i<lv?' on':''}"></div>`).join('');
  document.getElementById('tn').innerHTML=TAHKOT.map(t=>`<button class="tn-t" data-t="${t.i}" data-action="tahko"><div class="tn-dot"></div>${t.n}</button>`).join('');
  setTahko(1);
  LOG.add('sys',`${m.lbl} kirjautui sisään`,m.n+' · '+m.t);
}
function logout(){
  D.role=null;
  document.getElementById('s-app').style.display='none';
  document.getElementById('s-login').style.display='flex';
  document.getElementById('api-bar').style.display='none';
  const r=document.documentElement;
  r.style.setProperty('--fill','var(--c1)');r.style.setProperty('--ink','var(--i1)');r.style.setProperty('--dark','var(--d1)');
}

/* ─── T1: Työtilaukset / Workflow ─── */
function vT1(){
  const r=D.role;
  let h='';
  /* Opiskelija: omat tilaukset */
  if(r==='student'){
    const me=D.stu[0];
    const myWO=D.workOrders.filter(w=>w.stu===me.id);
    h+=sg([stl('Avoimia töitä',myWO.filter(w=>w.status!=='done').length,'','työtilauksia'),stl('Saldo',f2(me.b)+' €','',''+f2(me.o)+' € laskutettavaa')],2);
    h+=btn('+ Uusi työtilaus','open-modal','new-wo','prim full');
    h+=`<div style="font-size:12px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 8px">Omat työtilaukset</div>`;
    if(!myWO.length){h+=emp('📋','Ei avoimia tilauksia','Luo uusi työtilaus napilla yllä');}
    else h+=myWO.map(wo=>woCard(wo,r)).join('');
  }
  /* Pajamestari: kaikki tilaset, kuittaukset */
  else if(r==='paja'){
    const woPaja=D.workOrders.filter(w=>w.status==='waiting_paja');
    const woActive=D.workOrders.filter(w=>w.status==='active'&&w.pajaOk&&!w.matDone);
    h+=sg([stl('Odottaa kuittaustasi',woPaja.length,woPaja.length?'var(--i5)':'var(--i1)'),stl('Luovutettavaa',woActive.length,'','materiaalia')],2);
    if(woPaja.length)h+=woPaja.map(wo=>woCard(wo,r)).join('');
    if(woActive.length){h+=`<div style="font-size:12px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 8px">Materiaaliluovutus</div>`;h+=woActive.map(wo=>woCard(wo,r)).join('');}
    h+=`<div style="font-size:12px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 8px">Kaikki tilaukset</div>`;
    h+=D.workOrders.map(wo=>woCard(wo,r)).join('');
  }
  /* Lehtori */
  else if(r==='lehtori'){
    const woLeh=D.workOrders.filter(w=>w.status==='waiting_leh');
    h+=sg([stl('Hyväksyntää odottaa',woLeh.length,woLeh.length?'var(--i5)':'var(--i1)'),stl('Tilauksissa yht.',D.workOrders.length)],2);
    if(woLeh.length)h+=woLeh.map(wo=>woCard(wo,r)).join('');
    h+=D.workOrders.filter(w=>w.status!=='waiting_leh').map(wo=>woCard(wo,r)).join('');
  }
  /* Koord + Johto */
  else{
    h+=sg([stl('Kaikki tilaukset',D.workOrders.length),stl('Käynnissä',D.workOrders.filter(w=>w.status==='active').length)],2);
    h+=D.workOrders.map(wo=>woCard(wo,r)).join('');
  }
  return h;
}

function woCard(wo,role){
  const statusColors={active:'#4A8A4A',waiting_leh:'#2E5A72',waiting_paja:'#8A6A1E',done:'#888'};
  const col=statusColors[wo.status]||'#888';
  const steps=[
    {lbl:'Opiskelija lähettänyt',done:true},
    {lbl:'Lehtori kuittaa',done:wo.lehOk},
    {lbl:'Pajamestari kuittaa',done:wo.pajaOk},
    {lbl:'Materiaali luovutettu',done:wo.matDone},
  ];
  let actions='';
  if(role==='lehtori'&&wo.status==='waiting_leh')
    actions=`<div style="display:flex;gap:7px;margin-top:10px">${btn('✕ Hylkää','wo-action',wo.id+'|reject_leh','sm')} ${btn('✓ Hyväksy','wo-action',wo.id+'|approve_leh','sm prim')}</div>`;
  if(role==='paja'&&wo.status==='waiting_paja')
    actions=`<div style="display:flex;gap:7px;margin-top:10px">${btn('✕ Hylkää','wo-action',wo.id+'|reject_paja','sm')} ${btn('✓ Hyväksy & varaa materiaalit','wo-action',wo.id+'|approve_paja','sm prim')}</div>`;
  if(role==='paja'&&wo.status==='active'&&!wo.matDone)
    actions=`<div style="margin-top:10px">${btn('📦 Merkitse materiaalit luovutetuksi','wo-action',wo.id+'|mat_done','prim full sm')}</div>`;

  return `<div class="wo-card">
    <div class="wo-head">
      <div class="wo-status-dot" style="background:${col}"></div>
      <div class="wo-info">
        <div class="wo-title">${E(wo.title)}</div>
        <div class="wo-meta">${E(wo.stuName)} · ${wo.type==='course'?'Kurssisuoritus':'Oma työ'} · Luotu ${wo.created} · DL ${wo.due}</div>
      </div>
      ${sBdg(wo.status)}
    </div>
    <div class="wo-body">
      <div style="font-size:12px;color:var(--sub);margin-bottom:10px">${E(wo.desc)}</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">
        ${wo.mats.map(mid=>{const m=D.inv.find(x=>x.id===mid);return m?`<span style="background:color-mix(in srgb,var(--c1) 18%,#fff);border:1px solid color-mix(in srgb,var(--i1) 18%,transparent);border-radius:100px;padding:3px 10px;font-size:11px;font-weight:600;color:var(--i1)">📦 ${E(m.n)}</span>`:''}).join('')}
      </div>
      <div style="display:flex;gap:0">
        ${steps.map((s,i)=>`<div style="flex:1;text-align:center"><div style="width:100%;height:3px;background:${s.done?'var(--i1)':'var(--bor)'};transition:.3s"></div><div style="font-size:9px;color:${s.done?'var(--i1)':'var(--hint)'};margin-top:4px;font-weight:${s.done?700:400}">${E(s.lbl)}</div></div>`).join('')}
      </div>
      ${actions}
    </div>
  </div>`;
}

  h+=card(`<h3>Hankinnat / ostopyynnöt</h3>${D.ord.map(o=>row('',`<div class="rn">${E(o.n)}</div><div class="rs">${E(o.s)} · ${E(o.req)}</div>`,`<div style="display:flex;align-items:center;gap:6px;flex-shrink:0"><span style="font-weight:700">${f2(o.p)} €</span>${sBdg(o.st)}${(r==='paja'||r==='koord'||r==='johto')&&o.st==='pending'?btn('✓','set-ord',o.id+'|arrived','xs'):''}</div>`)).join('')}`);

      <div style="font-size:11px;color:var(--hint);margin-bottom:12px">${v<40?'✅ Hyvä — toimit selkeällä mielellä':v<70?'⚠️ Kohtalainen — priorisoi tärkeimmät':'🔴 Korkea — harkitse taukoa tai delegointia'}</div>

    <div style="margin-top:14px;font-size:12.5px;color:var(--sub);line-height:1.6">
      <strong>Vinkkejä kuorman vähentämiseen:</strong><br>
      → Kuittaa tai delegoi työtilauksia<br>
      → Tilaa kriittiset materiaalit ensin<br>
      → Ota 5 min tauko tunnin välein — se lisää tarkkuutta
    </div>`;
  }
  else if(type==='new-wo'){
    html=`<div class="sh-title">📋 Uusi työtilaus</div>
    <div class="nt info">Työtilaus käynnistää workflow-prosessin: lehtori kuittaa → pajamestari varaa materiaalit → työ alkaa.</div>

function closeM(){document.getElementById('ov').classList.remove('open')}

function checkStep(i){
  const el=document.getElementById('ps-'+i);const num=document.getElementById('psn-'+i);
  if(el&&num){el.style.opacity='.6';num.style.background='color-mix(in srgb,var(--c1) 40%,#fff)';num.style.color='var(--i1)';num.style.borderColor='var(--i1)';}
}

function doNewWO(){
  const title=document.getElementById('wo-title')?.value?.trim();
  const desc=document.getElementById('wo-desc')?.value?.trim();
  const type=document.getElementById('wo-type')?.value;
  const due=document.getElementById('wo-due')?.value;
  const mats=[...document.querySelectorAll('input[name="wo-mat"]:checked')].map(el=>el.value);
  if(!title){showT('⚠️ Anna työn nimi');return;}
  const me=D.stu[0];
  const wo={id:'wo'+Date.now(),stu:me.id,stuName:me.n,type,title,mats,
    status:type==='course'?'waiting_leh':'waiting_paja',
    lehOk:type!=='course',pajaOk:false,matDone:false,
    desc:desc||'',created:new Date().toLocaleDateString('fi-FI'),due:due||'—'};
  D.workOrders.unshift(wo);
  closeM();showT('📋 Työtilaus lähetetty!');
  LOG.add('ok','Työtilaus luotu',`${me.n}: ${title} — ${type==='course'?'odottaa lehtoria':'odottaa pajamestaria'}`);
  updateCog();setTahko(D.tahko);
}

function doWOAction(data){
  const[id,act]=data.split('|');const wo=D.workOrders.find(x=>x.id===id);if(!wo)return;
  if(act==='approve_leh'){wo.lehOk=true;wo.status='waiting_paja';showT('✓ Hyväksytty — siirtyy pajamestarille');LOG.add('ok','Työtilaus hyväksytty (lehtori)',wo.title);}
  else if(act==='reject_leh'){wo.status='done';showT('✕ Hylätty');LOG.add('warn','Työtilaus hylätty (lehtori)',wo.title);}
  else if(act==='approve_paja'){wo.pajaOk=true;wo.status='active';showT('✓ Hyväksytty — materiaalit varattavissa');LOG.add('ok','Työtilaus hyväksytty (pajamestari)',wo.title);}
  else if(act==='reject_paja'){wo.status='done';showT('✕ Hylätty');LOG.add('warn','Työtilaus hylätty (pajamestari)',wo.title);}
  else if(act==='mat_done'){
    wo.matDone=true;wo.status='done';
    const stu=D.stu.find(s=>s.id===wo.stu);
    wo.mats.forEach(mid=>{
      const m=D.inv.find(x=>x.id===mid);if(!m)return;
      const amt=m.u==='g'?20:m.u==='m'?1:m.u==='dl'?1:0.5;
      const tot=parseFloat((m.p*amt*1.15).toFixed(2));
      m.s=parseFloat((m.s-amt).toFixed(2));
      if(m.s<0)m.s=0;
      const ms=m.s,mm=m.m;
      m.st=ms<=0?'critical':ms<=(mm*0.5)?'critical':ms<=mm?'low':'ok';
      if(stu&&wo.type==='personal'){stu.b=parseFloat((stu.b+tot).toFixed(2));stu.o=parseFloat((stu.o+tot).toFixed(2));}
      D.txn.unshift({d:'Nyt',n:m.n,q:`${amt} ${m.u}`,c:wo.type==='course',t:tot});
    });
    showT('📦 Materiaalit luovutettu — inventaario päivitetty');
    LOG.add('ok','Materiaalit luovutettu ja inventaario päivitetty',wo.stuName+': '+wo.title);
  }
  updateCog();setTahko(D.tahko);
}

function doSign(){const me=D.stu[0];if(!me)return;me.sg=true;closeM();showT('✅ Paja-ajokortti aktivoitu!');LOG.add('ok','Paja-ajokortti allekirjoitettu',me.n);setTahko(D.tahko);}
function doPereh(){const sEl=document.getElementById('ps'),mEl=document.getElementById('pm');if(!sEl||!mEl)return;if(!D.peh[sEl.value])D.peh[sEl.value]={};D.peh[sEl.value][mEl.value]='ok';const sn=D.stu.find(s=>s.id===sEl.value)?.n||sEl.value;const mn=D.mach.find(m=>m.id===mEl.value)?.n||mEl.value;closeM();showT(`✅ Perehdytys — ${sn} · ${mn}`);LOG.add('ok','Perehdytys merkitty',sn+' → '+mn);setTahko(D.tahko);}
function doMaint(){const mc=D.mach.find(x=>x.id===D._maintId);if(!mc)return;mc.u=0;mc.st='ok';mc.last=new Date().toLocaleDateString('fi-FI');closeM();showT('✅ Huolto merkitty');LOG.add('ok','Kone huollettu',mc.n);setTahko(D.tahko);}
function doWork(){const el=document.getElementById('wt');if(!el?.value?.trim()){showT('⚠️ Kirjoita ensin');return;}closeM();showT('✅ Työloki tallennettu');LOG.add('ok','Työlokimerkintä',el.value.slice(0,80));}
function setOrd(ti){const[id,st]=ti.split('|');const o=D.ord.find(x=>x.id===id);if(o)o.st=st;showT(st==='arrived'?'✅ Tilaus hyväksytty':'❌ Hylätty');LOG.add(st==='arrived'?'ok':'warn','Ostopyyntö '+(st==='arrived'?'hyväksytty':'hylätty'),o?.n);setTahko(D.tahko);}
function billStu(id){const s=D.stu.find(x=>x.id===id);if(!s)return;showT(`✅ Lasku muodostettu — ${s.n}`);LOG.add('gold','Lasku muodostettu',`${s.n} — ${f2(s.o)} €`);}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-action]');if(!el)return;
  e.preventDefault();e.stopPropagation();
  const a=el.dataset.action,id=el.dataset.id||'';
  ({
    'login':       ()=>login(id),
    'tahko':       ()=>setTahko(+el.dataset.t),
    'open-modal':  ()=>openM(id),
    'open-chem':   ()=>openM('chem',id),
    'open-process':()=>openM('process',id),
    'close-modal': ()=>closeM(),
    'modal-maint': ()=>openM('maint',id),
    'modal-pereh': ()=>openM('pereh',id),
    'wo-action':   ()=>doWOAction(id),
    'do-new-wo':   ()=>doNewWO(),
    'do-sign':     ()=>doSign(),
    'do-pereh':    ()=>doPereh(),
    'do-maint':    ()=>doMaint(),
    'do-work':     ()=>doWork(),
    'set-ord':     ()=>setOrd(id),
    'bill-stu':    ()=>billStu(id),
    'space-item':  ()=>showT('📍 '+id),
  }[a]||function(){})();
});

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(document.getElementById('ov').classList.contains('open')){closeM();return;}
    if(document.getElementById('t-ov').classList.contains('open')){closeLog();return;}
  }
});
document.getElementById('ov').addEventListener('click',e=>{if(e.target===document.getElementById('ov'))closeM();});
document.getElementById('t-ov').addEventListener('click',e=>{if(e.target===document.getElementById('t-ov'))closeLog();});
